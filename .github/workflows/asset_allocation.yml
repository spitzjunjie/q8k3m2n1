name: 资产配置回测

on:
  schedule:
    # UTC 12:30 = 北京时间 20:30，工作日
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行资产配置回测
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          set -o pipefail
          python asset_allocation_backtest.py 2>&1 | tee logs/asset_allocation.txt

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-allocation-${{ github.run_number }}
          path: output/asset_allocation_results.json
          retention-days: 30
