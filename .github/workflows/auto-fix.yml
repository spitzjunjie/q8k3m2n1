      - name: 创建 GitHub Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/issue_body.md', 'utf8');

            const title = `[自动诊断] ${{ github.event.workflow_run.name }} 失败 (Run #${{ github.event.workflow_run.run_id }})`;

            // 搜索是否已有同名 issue（避免重复创建）
            const { data: existing } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${{ github.repository }} is:issue is:open ${title}`,
              per_page: 1,
            });

            if (existing.total_count > 0) {
              console.log(`⚠️ 已有类似 issue #${existing.items[0].number}，跳过创建`);
              return;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['auto-diagnosis', 'needs-triage'],
            });

            console.log(`✅ Issue 已创建: ${issue.data.html_url}`);

