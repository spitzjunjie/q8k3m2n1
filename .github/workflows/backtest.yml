name: 每日单次回测

# ============================================================
# 【重要】本 Workflow 只做每日单次回测（模拟交易）
# ============================================================
#
# 职责范围：
#   ✅ 每天对已上线策略做单次回测（今天选股）
#   ✅ 自动重试和数据源切换
#   ❌ 不做历史回测（由 Codex 本地/云端执行）
#   ❌ 不做代码自动修复（由 Codex 本地执行）
#
# ============================================================

on:
  # 每天收盘后自动运行（周一到周五 18:30 中国时间）
  schedule:
    - cron: '30 10 * * 1-5'  # UTC 10:30 = 中国时间 18:30
  # 也支持手动触发
  workflow_dispatch:
    inputs:
      strategies:
        description: '指定策略（逗号分隔），留空则回测全部'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # 第一阶段：Tushare 回测
  backtest-tushare:
    runs-on: ubuntu-latest
    outputs:
      success: ${{ steps.check-result.outputs.success }}
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4
      
      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: |
          pip install akshare pandas numpy requests tushare tqdm
      
      - name: 创建必要目录
        run: |
          mkdir -p data/cache output dashboard logs
      
      - name: 配置环境变量
        run: |
          echo "source=tushare" >> $GITHUB_OUTPUT
          echo "使用 Tushare 数据源"
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      
      - name: 预检策略文件
        run: python verify_strategies.py

      - name: 运行回测 (Tushare)
        run: |
          echo "开始 Tushare 回测..."
          python .github/scripts/resilient_backtest.py --source tushare --strategies "${{ inputs.strategies }}" 2>&1 | tee logs/backtest_output.txt
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          DATA_SOURCE: tushare
        continue-on-error: true

      - name: 保存错误日志
        if: always()
        run: |
          if [ -f logs/backtest_output.txt ]; then
            grep -E "error|Error|ERROR|failed|Failed|FAILED|exception|Exception" logs/backtest_output.txt > logs/error.log || true
          fi
      
      - name: 检查Tushare结果
        id: check-result
        run: |
          if [ -f output/strategy_data.json ]; then
            FILE_SIZE=$(stat -c%s output/strategy_data.json 2>/dev/null || stat -f%z output/strategy_data.json 2>/dev/null)
            if [ "$FILE_SIZE" -gt 1000 ]; then
              echo "success=true" >> $GITHUB_OUTPUT
              echo "Tushare 回测成功"
            else
              echo "success=false" >> $GITHUB_OUTPUT
              echo "Tushare 输出文件过小，切换到AKShare"
            fi
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "Tushare 回测失败，切换到AKShare"
          fi

  # 第二阶段：AKShare 备用回测
  backtest-akshare:
    needs: backtest-tushare
    if: needs.backtest-tushare.outputs.success == 'false'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4
      
      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: |
          pip install akshare pandas numpy requests tqdm
      
      - name: 创建必要目录
        run: |
          mkdir -p data/cache output dashboard logs
      
      - name: 预检策略文件
        run: python verify_strategies.py

      - name: 运行回测 (AKShare)
        run: |
          echo "切换到 AKShare 数据源"
          python .github/scripts/resilient_backtest.py --source akshare --strategies "${{ inputs.strategies }}" 2>&1 | tee logs/backtest_output.txt
        env:
          DATA_SOURCE: akshare
        continue-on-error: true

      - name: 保存错误日志
        if: always()
        run: |
          if [ -f logs/backtest_output.txt ]; then
            grep -E "error|Error|ERROR|failed|Failed|FAILED|exception|Exception" logs/backtest_output.txt > logs/error_akshare.log || true
          fi

      - name: 验证AKShare结果
        run: |
          if [ -f output/strategy_data.json ]; then
            FILE_SIZE=$(stat -c%s output/strategy_data.json 2>/dev/null || stat -f%z output/strategy_data.json 2>/dev/null)
            if [ "$FILE_SIZE" -gt 1000 ]; then
              echo "AKShare 回测成功"
            else
              echo "AKShare 也失败了"
              exit 1
            fi
          else
            echo "AKShare 回测失败"
            exit 1
          fi

  # 第三阶段：数据合并与推送
  merge-and-push:
    needs: [backtest-tushare, backtest-akshare]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4
      
      - name: 验证数据文件
        run: |
          if [ -f output/strategy_data.json ]; then
            echo "数据文件存在："
            ls -lh output/strategy_data.json
          else
            echo "警告：数据文件不存在"
          fi
      
      - name: 合并数据（保留历史）
        if: needs.backtest-tushare.outputs.success == 'true' || needs.backtest-akshare.outputs.success == 'true'
        run: |
          echo "合并数据..."
          python proper_merge.py || echo "合并完成或无需合并"
      
      - name: 推送数据到仓库
        if: needs.backtest-tushare.outputs.success == 'true' || needs.backtest-akshare.outputs.success == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add output/strategy_data.json output/backtest_report.json 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "无新数据需要推送"
          else
            git commit -m "自动回测更新 $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "数据已推送"
          fi

  # 第四阶段：失败通知
  failure-notify:
    needs: [backtest-tushare, backtest-akshare]
    if: failure()
    runs-on: ubuntu-latest
    
    steps:
      - name: 生成失败报告
        run: |
          echo "=========================================="
          echo "回测流程失败报告"
          echo "=========================================="
          echo "失败任务:"
          echo "  - 请检查 logs/error*.log 获取详细信息"
          echo ""
          echo "请检查以下内容:"
          echo "  1. API 密钥是否有效"
          echo "  2. 网络连接是否正常"
          echo "  3. 数据源服务是否可用"
          echo "=========================================="
