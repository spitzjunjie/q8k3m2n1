name: 每日单次回测

# =====================================================================
# 相比原版改了什么
# =====================================================================
#
# 【致命】原版第三阶段 merge-and-push 拿不到回测结果
#     backtest-tushare 在自己的 runner 上写 output/strategy_data.json，
#     merge-and-push 是**另一个全新的 runner**，只做了 checkout。
#     没有 upload-artifact / download-artifact，那个文件根本不存在。
#     于是 git add 的是仓库里的旧文件 → git diff --cached --quiet 成立
#     → 打印"无新数据需要推送" → 每天的回测结果全部被丢掉。
#
#     实证：output/strategy_data.json 里 update_time 是 2026-07-28，
#     backtest_end 是 2026-07-07。今天已经 8 月 2 号了。
#
#   → 现在改成把三个阶段合并成一个 job，中间不跨 runner。
#
# 【严重】continue-on-error: true 加在真正干活的步骤上
#     回测崩了 job 照样绿，check-result 只看文件大小 > 1000 字节，
#     旧文件也能过。失败被完全掩盖。
#     而 failure-notify 的 if: failure() 因此几乎永远不触发，
#     就算触发了也只是 echo 到日志里，没人看得见。
#   → 改成：允许单个数据源失败并降级，但两个源都失败必须让 job 红，
#     并且真的推一条飞书通知。
#
# 【安全】脚本注入
#     run: python ... --strategies "${{ inputs.strategies }}"
#     ${{ }} 是在 shell 之前做字符串替换的，输入里带引号或分号
#     就能在 runner 上执行任意命令，而这个 workflow 有 contents: write。
#   → 改成通过 env: 传值，shell 里用 "$STRATEGIES" 引用。
#
# 【可复现】pip install akshare pandas numpy requests tushare tqdm
#     完全绕开 requirements.txt，且没有任何版本约束。
#     akshare 发一个 breaking change，你的生产流水线第二天就挂，
#     而且没法复现昨天的结果。
#   → 改成装 requirements.txt，并加 pip 缓存。
#     （requirements.txt 本身也要补：efinance / groq / huggingface_hub /
#       openai / tushare / zhipuai 这 6 个在代码里 import 了但没声明。）
#
# 【并发】没有 concurrency group，也没有 pull --rebase
#     历史上已经因此加过 "git stash -u + rebase" 的补丁，
#     那是在治症状。
#   → 加 concurrency，push 前 pull --rebase。
#
# 【测试门禁】原来完全没有
#   → 加一步 pytest 冒烟测试。
# =====================================================================

on:
  schedule:
    # UTC 10:30 = 北京时间 18:30
    # 注意：GitHub 的定时任务是 best-effort，高峰期可能延迟 10~60 分钟；
    # 另外仓库 60 天没有任何提交活动，定时任务会被自动停用。
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      strategies:
        description: '指定策略（逗号分隔），留空则回测全部'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-backtest
  cancel-in-progress: false     # 回测跑一半被砍掉会留下半份数据，不要 cancel

jobs:
  backtest:
    runs-on: ubuntu-latest
    # backtest.py 全量回测冷缓存实测约 40-45 分钟（2026-07-07 43m47s），
    # 加上 Tushare→AKShare 降级与合并提交，给到 120 分钟（公开仓库上限 6 小时）。
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 冒烟测试（门禁）
        run: pytest tests/ -q -m "not network"

      - name: 创建目录
        run: mkdir -p data/cache output dashboard logs

      # ---------------------------------------------------------
      # 第一优先：Tushare
      # ---------------------------------------------------------
      - name: 回测 (Tushare)
        id: tushare
        continue-on-error: true          # 允许失败，下面会降级到 AKShare
        env:
          TUSHARE_TOKEN:     ${{ secrets.TUSHARE_TOKEN }}
          HF_TOKEN:          ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          FEISHU_APP_ID:     ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          DATA_SOURCE: tushare
          STRATEGIES: ${{ inputs.strategies }}      # ← 不再直接插进 shell
        run: |
          set -o pipefail
          python .github/scripts/resilient_backtest.py \
            --source tushare \
            --strategies "$STRATEGIES" 2>&1 | tee logs/backtest_tushare.txt

      - name: 检查 Tushare 结果
        id: check_tushare
        run: |
          # 只认"本次运行新写出来的、且内容合法的"文件。
          # 不能用 mtime 判断新鲜度：actions/checkout 会把仓库里的旧文件
          # 重新写到当前时间，旧数据会伪装成"刚产出"（7/25 起假成功的原因之一）。
          # 改用 update_time：backtest.py 只在跑完全部策略后才写入当前时间。
          if python - <<'PY'
          import json, sys, os, datetime
          p = 'output/strategy_data.json'
          if not os.path.exists(p):
              sys.exit(1)
          d = json.load(open(p, encoding='utf-8'))
          ut = (d.get('update_time') or '').strip()
          try:
              ut_dt = datetime.datetime.strptime(ut[:19], '%Y-%m-%d %H:%M:%S')
          except Exception:
              print(f'update_time 格式异常: {ut!r}'); sys.exit(1)
          # 回测可能跑 40+ 分钟，给 6 小时容差，足以区分"本次产出"与"仓库里的旧数据"
          if (datetime.datetime.now() - ut_dt).total_seconds() > 6 * 3600:
              print(f'update_time 太旧（{ut}），不是本次产出'); sys.exit(1)
          n = len(d.get('strategies', []))
          traded = sum(1 for s in d.get('strategies', []) if s.get('trades'))
          print(f'update_time={ut} 策略数={n} 有成交={traded}')
          # 全部零成交说明数据源其实没拿到数据
          sys.exit(0 if n > 0 and traded > 0 else 1)
          PY
          then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "::warning::Tushare 回测未产出有效结果，降级到 AKShare"
          fi

      # ---------------------------------------------------------
      # 降级：AKShare（同一个 runner，文件还在）
      # ---------------------------------------------------------
      - name: 回测 (AKShare 降级)
        if: steps.check_tushare.outputs.ok != 'true'
        id: akshare
        continue-on-error: true
        env:
          HF_TOKEN:          ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          FEISHU_APP_ID:     ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          DATA_SOURCE: akshare
          STRATEGIES: ${{ inputs.strategies }}
        run: |
          set -o pipefail
          python .github/scripts/resilient_backtest.py \
            --source akshare \
            --strategies "$STRATEGIES" 2>&1 | tee logs/backtest_akshare.txt

      - name: 两个数据源都失败则终止
        if: steps.check_tushare.outputs.ok != 'true' && steps.akshare.outcome != 'success'
        run: |
          echo "::error::Tushare 和 AKShare 都没能产出有效回测结果"
          exit 1

      # ---------------------------------------------------------
      # 合并 + 提交（同一个 runner，文件真实存在）
      # ---------------------------------------------------------
      - name: 合并历史数据
        run: python proper_merge.py

      - name: 提交结果
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

          git add -f output/strategy_data.json output/backtest_history.json

          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi

          git commit -m "chore: 每日回测更新 $(date -u +'%Y-%m-%d %H:%M UTC')"

          # 并发保护：先 rebase 再 push，失败重试 3 次
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "第 $i 次推送失败，5 秒后重试"
            sleep 5
          done
          echo "::error::推送失败"
          exit 1

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-logs-${{ github.run_number }}
          path: |
            logs/
            output/strategy_data.json
          retention-days: 14

      # ---------------------------------------------------------
      # 真正会发出去的失败通知
      # ---------------------------------------------------------
      - name: 失败时推飞书
        if: failure()
        env:
          FEISHU_APP_ID:     ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m pip install -q requests
          python - <<'PY'
          import os, json, requests
          aid, sec = os.environ.get('FEISHU_APP_ID'), os.environ.get('FEISHU_APP_SECRET')
          rid = os.environ.get('FEISHU_RECEIVE_ID')
          if not all([aid, sec, rid]):
              print('飞书未配置，跳过通知'); raise SystemExit(0)
          t = requests.post(
              'https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal',
              json={'app_id': aid, 'app_secret': sec}, timeout=10
          ).json().get('tenant_access_token')
          requests.post(
              'https://open.feishu.cn/open-apis/im/v1/messages',
              params={'receive_id_type': 'chat_id'},
              headers={'Authorization': f'Bearer {t}'},
              json={'receive_id': rid, 'msg_type': 'text',
                    'content': json.dumps({'text':
                        '每日回测失败\n' + os.environ.get('RUN_URL', '')})},
              timeout=10)
          print('已推送失败通知')
          PY
