# ============================================================
# 历史数据补齐工作流
# 用于补齐漏掉的每日回测数据
# ============================================================

name: 历史数据补齐

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      days:
        description: '回测天数'
        required: false
        default: '14'
      strategies:
        description: '策略名 (逗号分隔，默认全部)'
        required: false
        default: ''
      source:
        description: '数据源'
        required: false
        default: 'tushare'
        type: choice
        options:
          - tushare
          - akshare

  # 定时触发（每周日凌晨运行）
  schedule:
    - cron: '0 2 * * 0'

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: '1'

jobs:
  history-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6小时超时保护

    steps:
      - name: 检出的代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install akshare pandas numpy requests tushare tqdm lxml bs4 -q

      - name: 创建必要目录
        run: |
          mkdir -p data/cache output dashboard logs

      - name: 运行历史回测
        run: |
          echo "开始历史回测..."
          python backtest_history.py --source ${{ inputs.source || 'tushare' }} --days ${{ inputs.days || '14' }} ${{ inputs.strategies && format('--strategies {0}', inputs.strategies) || '' }}
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

      - name: 检查结果
        run: |
          if [ -f output/strategy_data.json ]; then
            echo "✅ 回测数据已更新"
            python -c "import json; d=json.load(open('output/strategy_data.json')); print(f'策略数: {d.get(\"strategy_count\", len(d.get(\"strategies\", [])))}')"
          else
            echo "⚠️ 未找到回测数据文件"
            exit 1
          fi

      - name: 提交结果
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add output/strategy_data.json output/new_strategy_results.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无新数据变化"
          else
            git commit -m "历史回测数据补齐 $(date +%Y-%m-%d)"
            git push
            echo "数据已推送"
          fi
