name: 实盘工具选择研究（手动）

# 一次性研究：静态 60/40 的沪深300 ETF 与现金工具选择（etf_selection_research.py）。
# 结果提交回触发时所选的分支（不直接推 main），供 IPS 第 2 节回填。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-etf-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行研究脚本
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p output/research
          python etf_selection_research.py --start 20231001 --end 20260930 2>&1 | tee output/research/etf_selection.txt

      - name: 提交结果
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add output/research/
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "chore: 实盘工具选择研究结果 $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep 5
          done
          exit 1
