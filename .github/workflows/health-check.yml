name: 数据健康检查

# 每个工作日检查静态 60/40 模拟盘（output/static6040_paper_state.json）是否仍在记账。
# GitHub 定时任务（每日回测）是 best-effort，可能延迟/跳过且无通知，
# （2026-10-03 前检查的是已停用的选股回测 strategy_data.json）
# 过期则发飞书告警（覆盖"定时跳过无感知"的问题）。

on:
  schedule:
    - cron: '47 14 * * 1-5'   # 工作日 22:47 北京（避开整点高峰）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装 requests（告警用）
        run: pip install requests -q

      - name: 检查数据新鲜度
        env:
          FEISHU_APP_ID:     ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
        run: python .github/scripts/health_check.py
