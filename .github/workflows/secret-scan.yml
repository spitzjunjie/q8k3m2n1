name: 密钥扫描

# =====================================================================
# 防止密钥再次被提交。每次 push / PR 都跑，发现就让 CI 红。
# 这是"不再犯"的机制保障 —— 光靠记性是不够的。
# =====================================================================

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 1'   # 每周一 UTC 20:00 全量复查一次

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks 全历史扫描
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 【注意】现在只扫当前工作区，不扫历史。
      # 因为 git 历史里还留着清理前的旧密钥（你选择了暂不重写历史），
      # 全历史扫描一定会报红。等以后跑完 scripts/purge_git_history.sh，
      # 把 fetch-depth 改成 0、去掉下面的 --no-git，就能开启全历史门禁。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_NOTIFY_USER_LIST: ""
        with:
          args: "detect --no-git --source . --redact --verbose"

  custom-patterns:
    name: 自定义模式扫描（中国区服务）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 扫描 Tushare / 飞书 / 聚宽 等凭证
        run: |
          set -uo pipefail
          FAIL=0
          scan() {
            local label="$1" pattern="$2"
            # 排除本 workflow 自身和 .example 模板
            if grep -rEIn "$pattern" . \
                 --exclude-dir=.git \
                 --exclude-dir=node_modules \
                 --exclude-dir=__pycache__ \
                 --exclude='*.example' \
                 --exclude='secret-scan.yml' \
                 --exclude='purge_secrets.py' ; then
              echo "::error::发现 ${label}"
              FAIL=1
            fi
          }
          scan "Tushare Token（56位hex）"  "['\"][0-9a-f]{56}['\"]"
          scan "飞书 App ID"                "cli_[a-z0-9]{16,}"
          scan "HuggingFace Token"          "hf_[A-Za-z0-9]{30,}"
          scan "Groq Key"                   "gsk_[A-Za-z0-9]{40,}"
          scan "GitHub PAT"                 "ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{50,}"
          scan "明文密码"                    "(password|passwd|pwd)[[:space:]]*=[[:space:]]*['\"][^'\"]{4,}['\"]"
          scan "手机号"                      "['\"]1[3-9][0-9]{9}['\"]"

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "检测到硬编码凭证。修复方式："
            echo "  1. 改成 os.environ.get('XXX', '')"
            echo "  2. 把真实值配到 GitHub Secrets"
            echo "  3. 去对应平台吊销这个已泄漏的密钥"
            exit 1
          fi
          echo "未发现硬编码凭证"
