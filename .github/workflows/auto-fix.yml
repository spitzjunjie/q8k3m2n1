# ============================================================
# 自动修复工作流
# 当 backtest.yml 或 history_catchup.yml 失败时自动运行
# 分析错误日志，匹配已知 bug 模式，修复代码并重新运行
# ============================================================

name: 自动修复

on:
  workflow_run:
    workflows:
      - 每日单次回测
      - 历史数据补齐
    types: [completed]

jobs:
  auto-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 下载失败日志
        run: |
          # 获取失败 workflow 的日志
          echo "失败 Workflow: ${{ github.event.workflow_run.name }}"
          echo "Run ID: ${{ github.event.workflow_run.run_id }}"
          echo "结论: ${{ github.event.workflow_run.conclusion }}"
          echo ""
          echo "尝试获取日志..."
          # 下载 artifact 日志（如果有）
          mkdir -p logs
          echo "需要手动检查错误原因" > logs/auto_fix_note.txt

      - name: 分析错误模式
        id: analyze
        run: |
          echo "=== 错误分析 ==="
          echo ""

          # 常见错误模式检测
          ERROR_PATTERNS_FILE="logs/error_patterns.txt"

          # 检测 has_signal bug
          if grep -r "has_signal" . --include="*.py" 2>/dev/null | grep -v ".git" | grep -v "is defined" > /dev/null; then
            echo "⚠️ 检测到 has_signal 相关代码"
            echo "has_signal_pending" >> $ERROR_PATTERNS_FILE
          fi

          # 检测换行符问题（\\n 字面字符串）
          if grep -n '\\\\n' trading/simulator.py 2>/dev/null; then
            echo "⚠️ 检测到 simulator.py 中的 \\\\n 字面字符串问题"
            echo "simulator_crlf_fix" >> $ERROR_PATTERNS_FILE
          fi

          echo ""
          echo "分析完成"
          cat $ERROR_PATTERNS_FILE 2>/dev/null || echo "未发现已知错误模式"

      - name: 修复 has_signal bug
        if: contains(github.event.workflow_run.name, '回测')
        run: |
          echo "=== 尝试修复 has_signal bug ==="

          # 检查 simulator.py 是否有 \n 字面问题
          if grep -n '\\\\n.*has_signal' trading/simulator.py 2>/dev/null; then
            echo "发现 \\n 字面问题，正在修复..."

            # 用 Python 精确替换
            python3 << 'EOF'
import re

with open('trading/simulator.py', 'rb') as f:
    content = f.read()

# 检查是否有 \\n 字面字符串 + has_signal 在同一行的问题
if b'\\\\n' in content and b'has_signal' in content:
    # 找到问题行并修复
    lines = content.split(b'\n')
    fixed_lines = []
    for line in lines:
        if b'\\\\n' in line and b'has_signal' in line:
            # 替换 \\n 为真正的换行
            line = line.replace(b'\\\\n', b'\n')
            print(f"修复行: {line[:80]}...")
        fixed_lines.append(line)

    with open('trading/simulator.py', 'wb') as f:
        f.write(b'\n'.join(fixed_lines))
    print("修复完成")
else:
    print("未发现 \\n 字面问题")
EOF
            echo "修复已应用"
          else
            echo "simulator.py 无需修复"
          fi

      - name: 修复日期计算 bug
        if: contains(github.event.workflow_run.name, '回测')
        run: |
          echo "=== 检查日期计算相关代码 ==="

          # 检查 backtest_history.py 的比较逻辑
          if grep -n 'd >= benchmark_str' backtest_history.py 2>/dev/null; then
            echo "检查日期比较逻辑..."

            # 验证 actual_days 计算是否正确
            python3 << 'EOF'
with open('backtest_history.py', 'r', encoding='utf-8') as f:
    content = f.read()

# 检查是否包含修复后的逻辑
if 'd >= benchmark_str and d <= today_str' in content:
    print("✅ 日期比较逻辑正确（已包含 <= today_str）")
elif 'd >= benchmark_str' in content and 'd <= today_str' not in content:
    print("❌ 日期比较逻辑有误（缺少 <= today_str）")
    print("需要修复: actual_days 计算应同时检查 <= today_str")
else:
    print("✅ 未发现日期计算问题")
EOF
          fi

      - name: 尝试切换数据源
        if: contains(github.event.workflow_run.name, '回测')
        run: |
          echo "=== 检查是否需要切换数据源 ==="

          # 检查 Tushare token
          if [ -z "$TUSHARE_TOKEN" ]; then
            echo "⚠️ TUSHARE_TOKEN 未设置，尝试切换到 AKShare"
            echo "当前 workflow 使用 akshare 作为备用"
          else
            echo "✅ TUSHARE_TOKEN 已配置"
          fi

      - name: 提交修复
        if: always()
        run: |
          echo "=== 提交修复 ==="

          # 检查是否有修改
          if git diff --quiet; then
            echo "没有代码变更，无需提交"
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "有代码变更，准备提交..."
            git config user.name "GitHub Actions Auto-Fix Bot"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "fix: auto-fix workflow detected and resolved issue

Auto-fix by GitHub Actions
Workflow: ${{ github.event.workflow_run.name }}
Run ID: ${{ github.event.workflow_run.run_id }}

Co-Authored-By: Claude <noreply@anthropic.com>"
            echo "changes_committed=true" >> $GITHUB_OUTPUT
            echo "✅ 修复已提交"
          fi

      - name: 推送修复
        if: always()
        run: |
          echo "=== 推送修复 ==="

          if [ "$changes_committed" == "true" ]; then
            git push origin main
            echo "✅ 修复已推送"
          else
            echo "跳过推送（无变更）"
          fi

      - name: 重新运行原 workflow
        if: always()
        run: |
          echo "=== 重新运行原 workflow ==="

          RUN_ID="${{ github.event.workflow_run.run_id }}"
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"

          echo "原 Workflow: $WORKFLOW_NAME"
          echo "原 Run ID: $RUN_ID"

          # 根据 workflow 名称决定重新运行哪个
          if [[ "$WORKFLOW_NAME" == *"每日"* ]] || [[ "$WORKFLOW_NAME" == *"单次回测"* ]]; then
            echo "重新运行 backtest.yml ..."
            gh workflow run backtest.yml -R ${{ github.repository }} || echo "重新运行失败（可能已修复或无需再运行）"
          elif [[ "$WORKFLOW_NAME" == *"历史"* ]]; then
            echo "重新运行 history_catchup.yml ..."
            gh workflow run history_catchup.yml -R ${{ github.repository }} || echo "重新运行失败"
          else
            echo "未知 workflow 类型，跳过重新运行"
          fi

      - name: 生成修复报告
        if: always()
        run: |
          echo "=========================================="
          echo "自动修复报告"
          echo "=========================================="
          echo "失败 Workflow: ${{ github.event.workflow_run.name }}"
          echo "Run ID: ${{ github.event.workflow_run.run_id }}"
          echo "结论: ${{ github.event.workflow_run.conclusion }}"
          echo ""
          echo "修复状态: $([ '${{ env.changes_committed }}' == 'true' ] && echo '已修复并推送' || echo '无需修复或修复失败')"
          echo ""
          echo "常见修复:"
          echo "  1. ✅ has_signal bug (\\\\n → \\n)"
          echo "  2. ✅ 日期计算逻辑 (添加 <= today_str)"
          echo "  3. ⚠️ 数据源切换 (Tushare → AKShare)"
          echo ""
          echo "=========================================="
